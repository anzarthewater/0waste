<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts - 0Waste</title>
    <link rel="stylesheet" href="postsstyle.css">
</head>
<body>
    <div id="header">
      <table>
        <tb>
          <tr>
            <td>
              <p id="home">Home</p>
            </td>
            <td>
              <p id="share" style="color:#E4D24C;">Share</p>
            </td>

             <td style="float:right; margin-right: 10px; width: auto;">
              <p id="signin">Sign In</p>
            </td>
          </tr>
        </tb>
      </table>
    </div>
    <div class="container">
        <h1>Share</h1>

        <div class="post-form">
            <h2 style="color: #ffffff; margin-bottom: 15px; font-size: 18px;">Create a New Post</h2>
          
            <div class="form-group">
                <label for="postTitle">Title:</label>
                <input type="text" id="postTitle" placeholder="Enter post title" required>
            </div>
            <div class="form-group">
                <label for="postContent">Content:</label>
                <textarea id="postContent" placeholder="Share a description of your content, location, etc..." required></textarea>
            </div>
            <button id="submitBtn">Post</button>
        </div>

        <div class="posts-list">
            <h2 style="color: #333; margin-bottom: 15px; font-size: 18px;">Recent Posts</h2>
            <div id="postsContainer">
                <div class="no-posts">Loading posts...</div>
            </div>
        </div>
    </div>


    <script type="module">
        import { getAllPosts, createPost } from './posts.js';

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

 
        async function displayPosts() {
            const postsContainer = document.getElementById('postsContainer');
            try {
                const posts = await getAllPosts();

                if (posts.length === 0) {
                    postsContainer.innerHTML = '<div class="no-posts">No posts yet. Be the first to post!</div>';
                    return;
                }

                postsContainer.innerHTML = posts.map(post => `
                    <div class="post">
                        <div class="post-title">${escapeHtml(post.title)}</div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        <div class="post-meta">
                            By ${escapeHtml(post.username)} &bull;
                            ${post.createdAt?.toDate ? new Date(post.createdAt.toDate()).toLocaleString() : new Date(post.createdAt).toLocaleString()}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                postsContainer.innerHTML = `<div class="error-msg">Failed to load posts: ${err.message}</div>`;
            }
        }

      
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) return;

            try {
                await createPost(title, content); 
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                await displayPosts();
            } catch (err) {
                alert('Failed to create post: ' + err.message);
            }
        });

        // Load posts on page load
        displayPosts();
    </script>
</body>
</html>
